# Host nginx vhost for when the server's own nginx already owns ports 80/443
# (other vhosts on the same box). The `frontend` container then listens on
# loopback only (HTTP_PORT=127.0.0.1:8080, DISABLE_SSL=true in .env) and this
# vhost proxies to it. TLS is terminated here: run
#   sudo certbot --nginx -d controlroom.point2point.org.uk
# once after enabling this file and certbot adds the 443 server block itself.
# See "Behind an existing host nginx" in the README.
server {
    listen 80;
    server_name controlroom.point2point.org.uk;

    # Add Fleet bulk uploads post a whole CSV (up to ~4000 routers) in one
    # request - matches the limit in frontend/nginx.dev.conf.
    client_max_body_size 10m;

    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
