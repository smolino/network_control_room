# Message bus between mediation (inside `backend`) and normalizer/correlator.
# Single broker, KRaft mode (no ZooKeeper) - same as docker-compose.yml.
# No PersistentVolumeClaim here, matching docker-compose.yml's own kafka
# service, which also has no volume: a lost broker restarts with a fresh
# cluster ID and empty topics, which is fine for this demo pipeline (topics
# get repopulated live by the simulator). Add a PVC + switch to a
# StatefulSet if you need Kafka data to survive pod restarts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: ncr
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          ports:
            - containerPort: 9092
            - containerPort: 9093
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka:9093"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
          readinessProbe:
            exec: {command: ["/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]}
            periodSeconds: 10
            failureThreshold: 20
          livenessProbe:
            exec: {command: ["/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]}
            periodSeconds: 15
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: 1, memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: ncr
spec:
  selector:
    app: kafka
  ports:
    - {name: plaintext, port: 9092, targetPort: 9092}
    - {name: controller, port: 9093, targetPort: 9093}
