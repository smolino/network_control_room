# Generates the 400 primary + 4000 customer routers and continuously sends
# real SNMP traps to `backend`. Single instance, standing in for the whole
# simulated fleet - same as docker-compose.yml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator
  namespace: ncr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simulator
  template:
    metadata:
      labels:
        app: simulator
    spec:
      imagePullSecrets:
        - name: dockerhub-cred
      initContainers:
        - name: wait-for-backend
          image: busybox:1.36
          command: ["sh", "-c", "until wget -q -O- http://backend:8000/api/health; do echo waiting for backend; sleep 2; done"]
      containers:
        - name: simulator
          image: docker.io/mescalo/network-control-room-simulator:latest
          env:
            - {name: TRAP_HOST, value: backend}
          envFrom:
            - configMapRef: {name: ncr-config}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
