apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ncr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: dockerhub-cred
      containers:
        - name: frontend
          image: docker.io/mescalo/network-control-room-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ncr
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      # nodePort omitted - let Kubernetes pick one from the default
      # 30000-32767 range; run `kubectl get svc -n ncr frontend` to see it.
