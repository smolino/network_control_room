# The frontend image's baked-in nginx.conf is HTTPS-only, hardcoded to
# controlroom.point2point.org.uk, and expects certs from the `certbot`
# compose service at /etc/letsencrypt - none of which exists in-cluster.
# Rather than build a separate k8s-only image, this ConfigMap overrides
# /etc/nginx/conf.d/default.conf at runtime with a plain-HTTP config that
# proxies /api and /ws to the backend Service, same routes as the original.
# Add TLS back later (e.g. an Ingress + cert-manager) without touching the image.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-conf
  namespace: ncr
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /ws/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ncr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: dockerhub-cred
      containers:
        - name: frontend
          image: docker.io/mescalo/network-control-room-frontend:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
      volumes:
        - name: nginx-conf
          configMap: {name: frontend-nginx-conf}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ncr
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      # nodePort omitted - let Kubernetes pick one from the default
      # 30000-32767 range; run `kubectl get svc -n ncr frontend` to see it.
