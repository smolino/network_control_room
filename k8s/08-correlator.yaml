# Enrichment + Neo4j-backed root-cause correlation + the actual Postgres
# write: norm-alarms -> incident-events. Reuses the backend image with a
# different command, same as docker-compose.yml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: correlator
  namespace: ncr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: correlator
  template:
    metadata:
      labels:
        app: correlator
    spec:
      imagePullSecrets:
        - name: dockerhub-cred
      # No initContainers: correlator.py already retries Kafka with backoff
      # (see README) if it starts before kafka/postgres/neo4j are reachable.
      containers:
        - name: correlator
          image: docker.io/mescalo/network-control-room-backend:latest
          command: ["python", "-m", "app.streaming.correlator"]
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom: {configMapKeyRef: {name: ncr-config, key: KAFKA_BOOTSTRAP_SERVERS}}
            - name: NEO4J_URI
              valueFrom: {configMapKeyRef: {name: ncr-config, key: NEO4J_URI}}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: ncr-secrets, key: DATABASE_URL}}
            - name: NEO4J_USER
              valueFrom: {secretKeyRef: {name: ncr-secrets, key: NEO4J_USER}}
            - name: NEO4J_PASSWORD
              valueFrom: {secretKeyRef: {name: ncr-secrets, key: NEO4J_PASSWORD}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
