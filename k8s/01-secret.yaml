# Same default dev credentials as .env.example / docker-compose.yml.
# Change these (and re-apply) before using this outside a throwaway/demo
# cluster - these are placeholders, not meant to be committed as real secrets.
apiVersion: v1
kind: Secret
metadata:
  name: ncr-secrets
  namespace: ncr
type: Opaque
stringData:
  POSTGRES_USER: ncr
  POSTGRES_PASSWORD: ncr
  POSTGRES_DB: ncr
  # Matches DATABASE_URL's default in docker-compose.yml, pointed at the
  # in-cluster `postgres` Service instead of the compose service name.
  DATABASE_URL: postgresql+psycopg2://ncr:ncr@postgres:5432/ncr
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ncrpassword
  # neo4j's NEO4J_AUTH env var wants "user/password" as one string - kept as
  # its own key since Kubernetes env vars can't concatenate two secret keys.
  NEO4J_AUTH: neo4j/ncrpassword
---
# Only needed if docker.io/mescalo is a private repository. Create with:
#   kubectl create secret docker-registry dockerhub-cred \
#     --docker-server=docker.io \
#     --docker-username=mescalo \
#     --docker-password='<your-dockerhub-token>' \
#     --namespace=ncr
# then keep the `imagePullSecrets: [{name: dockerhub-cred}]` already set on
# the backend/frontend/simulator Deployments below. If the repo is public,
# this secret is simply unused - no need to remove the references.
