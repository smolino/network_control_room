# FastAPI app: SNMP trap listener + fiber-fault generator (pure Kafka
# producers), the REST API, and the incident-events -> WebSocket relay.
# Image: pushed from ./backend via scripts/build-and-push.sh.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-data
  namespace: ncr
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ncr
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: dockerhub-cred
      initContainers:
        # depends_on: condition: service_healthy has no direct Kubernetes
        # equivalent - the app already retries Kafka/Neo4j with backoff (see
        # README), but Postgres migrations on startup want it reachable
        # first, so wait for all three the same way compose's healthchecks did.
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done
              until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done
              until nc -z neo4j 7687; do echo waiting for neo4j; sleep 2; done
      containers:
        - name: backend
          image: docker.io/mescalo/network-control-room-backend:latest
          ports:
            - {containerPort: 8000, name: http}
            - {containerPort: 1162, protocol: UDP, name: snmp-trap}
          envFrom:
            - configMapRef: {name: ncr-config}
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: ncr-secrets, key: DATABASE_URL}}
            - name: NEO4J_USER
              valueFrom: {secretKeyRef: {name: ncr-secrets, key: NEO4J_USER}}
            - name: NEO4J_PASSWORD
              valueFrom: {secretKeyRef: {name: ncr-secrets, key: NEO4J_PASSWORD}}
          volumeMounts:
            - {name: backend-data, mountPath: /app/data}
          readinessProbe:
            httpGet: {path: /api/health, port: 8000}
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet: {path: /api/health, port: 8000}
            periodSeconds: 10
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: 1, memory: 512Mi}
      volumes:
        - name: backend-data
          persistentVolumeClaim: {claimName: backend-data}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ncr
spec:
  selector:
    app: backend
  ports:
    - {name: http, port: 8000, targetPort: 8000}
    - {name: snmp-trap, port: 1162, targetPort: 1162, protocol: UDP}
