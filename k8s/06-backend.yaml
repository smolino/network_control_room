# FastAPI app: SNMP trap listener + fiber-fault generator (pure Kafka
# producers), the REST API, and the incident-events -> WebSocket relay.
# Image: pushed from ./backend via scripts/build-and-push.sh.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-data
  namespace: ncr
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ncr
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: dockerhub-cred
      # No initContainers: depends_on: condition: service_healthy has no
      # direct Kubernetes equivalent, and this Deployment deliberately
      # doesn't wait for postgres/kafka/neo4j to be reachable first. The
      # app already retries Kafka/Neo4j with backoff (see README); if
      # init_db() hits Postgres before it's ready, the container exits and
      # the default restartPolicy (Always) retries it until Postgres is up.
      containers:
        - name: backend
          image: docker.io/mescalo/network-control-room-backend:latest
          ports:
            - {containerPort: 8000, name: http}
            - {containerPort: 1162, protocol: UDP, name: snmp-trap}
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: ncr-secrets, key: DATABASE_URL}}
            - name: NEO4J_USER
              valueFrom: {secretKeyRef: {name: ncr-secrets, key: NEO4J_USER}}
            - name: NEO4J_PASSWORD
              valueFrom: {secretKeyRef: {name: ncr-secrets, key: NEO4J_PASSWORD}}
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom: {configMapKeyRef: {name: ncr-config, key: KAFKA_BOOTSTRAP_SERVERS}}
            - name: NEO4J_URI
              valueFrom: {configMapKeyRef: {name: ncr-config, key: NEO4J_URI}}
            - name: TRAP_HOST
              valueFrom: {configMapKeyRef: {name: ncr-config, key: TRAP_HOST}}
            - name: TRAP_PORT
              valueFrom: {configMapKeyRef: {name: ncr-config, key: TRAP_PORT}}
            - name: TRAP_COMMUNITY
              valueFrom: {configMapKeyRef: {name: ncr-config, key: TRAP_COMMUNITY}}
            - name: FLAP_WINDOW_SECONDS
              valueFrom: {configMapKeyRef: {name: ncr-config, key: FLAP_WINDOW_SECONDS}}
            - name: FLAP_TRANSITION_THRESHOLD
              valueFrom: {configMapKeyRef: {name: ncr-config, key: FLAP_TRANSITION_THRESHOLD}}
            - name: CORS_ORIGINS
              valueFrom: {configMapKeyRef: {name: ncr-config, key: CORS_ORIGINS}}
          volumeMounts:
            - {name: backend-data, mountPath: /app/data}
          readinessProbe:
            httpGet: {path: /api/health, port: 8000}
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet: {path: /api/health, port: 8000}
            periodSeconds: 10
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: 1, memory: 512Mi}
      volumes:
        - name: backend-data
          persistentVolumeClaim: {claimName: backend-data}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ncr
spec:
  selector:
    app: backend
  ports:
    - {name: http, port: 8000, targetPort: 8000}
    - {name: snmp-trap, port: 1162, targetPort: 1162, protocol: UDP}
