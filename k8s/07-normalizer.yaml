# Stateless: raw-alarms -> norm-alarms (OID -> Common Alarm Model). No DB/
# Neo4j access at all. Reuses the backend image with a different command,
# same as docker-compose.yml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: normalizer
  namespace: ncr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: normalizer
  template:
    metadata:
      labels:
        app: normalizer
    spec:
      imagePullSecrets:
        - name: dockerhub-cred
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done"]
      containers:
        - name: normalizer
          image: docker.io/mescalo/network-control-room-backend:latest
          command: ["python", "-m", "app.streaming.normalizer"]
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom: {configMapKeyRef: {name: ncr-config, key: KAFKA_BOOTSTRAP_SERVERS}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
