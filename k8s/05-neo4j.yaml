# Static topology graph (Router/Interface/FiberSpan + SUPPORTED_BY) used by
# app.correlation for root-cause traversal. Written by backend on BGP seed,
# read by correlator. Mutable alarm state always stays in Postgres.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: ncr
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      containers:
        - name: neo4j
          image: neo4j:5.24
          ports:
            - containerPort: 7474
            - containerPort: 7687
          env:
            - name: NEO4J_AUTH
              valueFrom: {secretKeyRef: {name: ncr-secrets, key: NEO4J_AUTH}}
          volumeMounts:
            - name: neo4j-data
              mountPath: /data
          readinessProbe:
            httpGet: {path: /, port: 7474}
            periodSeconds: 10
            failureThreshold: 20
          livenessProbe:
            httpGet: {path: /, port: 7474}
            periodSeconds: 15
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: 1, memory: 2Gi}
  volumeClaimTemplates:
    - metadata:
        name: neo4j-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: ncr
spec:
  clusterIP: None
  selector:
    app: neo4j
  ports:
    - {name: http, port: 7474, targetPort: 7474}
    - {name: bolt, port: 7687, targetPort: 7687}
