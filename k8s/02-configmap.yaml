# Non-secret config shared across services, mirroring the plain-value env
# vars in docker-compose.yml (see "Configuration reference" in the README).
apiVersion: v1
kind: ConfigMap
metadata:
  name: ncr-config
  namespace: ncr
data:
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  NEO4J_URI: bolt://neo4j:7687
  TRAP_HOST: "0.0.0.0"
  TRAP_PORT: "1162"
  TRAP_COMMUNITY: public
  FLAP_WINDOW_SECONDS: "600"
  FLAP_TRANSITION_THRESHOLD: "4"
  CORS_ORIGINS: "*"
  # simulator (+ the backend's synthetic fiber-cut generator - set "false"
  # for a real deployment without the simulator)
  FIBER_FAULT_SIMULATION: "true"
  FIBER_FAULT_INTERVAL_MIN_SECONDS: "180"
  FIBER_FAULT_INTERVAL_MAX_SECONDS: "360"
  FIBER_FAULT_DURATION_SECONDS: "60"
  BACKEND_API_URL: http://backend:8000
  FLAPPING_ROUTER_COUNT: "2"
  DOWN_ROUTER_COUNT: "1"
  FLAPPING_BUNDLE_COUNT: "1"
  FLAP_QUIET_MIN_SECONDS: "300"
  FLAP_QUIET_MAX_SECONDS: "600"
  TICK_MIN_SECONDS: "20"
  TICK_MAX_SECONDS: "40"
  CUSTOMER_TICK_MIN_SECONDS: "60"
  CUSTOMER_TICK_MAX_SECONDS: "120"
  PRIMARY_EVENT_INTERVAL_SECONDS: "7200"
  CUSTOMER_EVENT_INTERVAL_SECONDS: "172800"
  BGP_INCIDENT_INTERVAL_SECONDS: "600"
  BUNDLE_FAILURE_INTERVAL_SECONDS: "900"
